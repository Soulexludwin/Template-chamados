<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Técnico - Suporte TI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-[#0c0a1d] text-slate-100 min-h-screen">

  <!-- Tela de Login -->
  <div id="loginScreen" class="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
    <div class="bg-indigo-950 border border-indigo-800/60 p-8 rounded-xl shadow-2xl w-full max-w-md">
      <h2 class="text-2xl font-bold text-white mb-2 flex items-center gap-2"><span>🔐</span> Acesso Restrito</h2>
      <p class="text-slate-400 text-sm mb-6">Digite a senha técnica para gerenciar o sistema.</p>
      
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Senha do Técnico</label>
          <input type="password" id="senhaInput" required autocomplete="current-password" class="w-full px-4 py-2.5 bg-indigo-900/30 border border-indigo-700/60 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Digite a senha...">
        </div>
        <button type="submit" id="btnLoginSubmit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow transition">Entrar no Painel</button>
      </form>
    </div>
  </div>

  <!-- Painel do Técnico -->
  <div id="techPanel" class="hidden">
    <header class="bg-indigo-950/80 backdrop-blur-md border-b border-indigo-900/50 text-white shadow-lg sticky top-0 z-10">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🛠️</span>
          <h1 class="text-xl font-bold tracking-wide">Painel Geral de Chamados</h1>
        </div>
        <div class="flex items-center gap-3">
          <a href="/" class="bg-indigo-900/60 hover:bg-indigo-800 text-slate-200 border border-indigo-700/50 px-4 py-2 rounded-lg text-sm font-medium transition">Ver Portal do Usuário</a>
          <button id="btnSair" class="bg-red-600/80 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Sair</button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
      <!-- Barra de Ferramentas -->
      <div class="bg-indigo-950/60 border border-indigo-900/60 p-4 rounded-xl shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3 w-full md:w-auto flex-wrap">
          <input type="text" id="filtroTexto" placeholder="Pesquisar nos chamados..." class="px-4 py-2 bg-indigo-900/30 border border-indigo-700/60 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-full md:w-64 placeholder-slate-500">
          
          <select id="ordenacao" class="px-3 py-2 bg-indigo-900/80 border border-indigo-700/60 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="recente">Mais Recente para Mais Antigo</option>
            <option value="antigo">Mais Antigo para Mais Recente</option>
            <option value="prioridade">Por Prioridade (Alta &gt; Baixa)</option>
            <option value="status">Por Status (Abertos primeiro)</option>
          </select>
        </div>

        <div class="flex items-center gap-2 bg-indigo-900/40 p-1 rounded-lg border border-indigo-800">
          <button id="btnModoCards" class="px-3 py-1.5 text-xs font-medium rounded-md bg-blue-600 text-white transition">Cards</button>
          <button id="btnModoPlanilha" class="px-3 py-1.5 text-xs font-medium rounded-md text-slate-300 hover:text-white transition">📊 Planilha (SQL)</button>
        </div>
      </div>

      <!-- Modo Cards -->
      <div id="viewCards" class="grid grid-cols-1 gap-4"></div>

      <!-- Modo Planilha / Tabela SQL -->
      <div id="viewPlanilha" class="hidden overflow-x-auto bg-indigo-950/60 border border-indigo-900/60 rounded-xl shadow-lg">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="bg-indigo-900/60 text-slate-300 border-b border-indigo-800">
              <th class="p-4 font-semibold">ID</th>
              <th class="p-4 font-semibold">Data / Hora</th>
              <th class="p-4 font-semibold">Setor</th>
              <th class="p-4 font-semibold">Título</th>
              <th class="p-4 font-semibold">Descrição</th>
              <th class="p-4 font-semibold">Prioridade</th>
              <th class="p-4 font-semibold">Status</th>
              <th class="p-4 font-semibold text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaCorpo" class="divide-y divide-indigo-900/40 text-slate-200"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal de Chat Técnico -->
  <div id="chatModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-40">
    <div class="bg-indigo-950 border border-indigo-800 rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[85vh]">
      <div class="p-4 border-b border-indigo-800/80 flex justify-between items-center">
        <div>
          <h3 id="chatTitulo" class="font-bold text-white text-base">Chat do Chamado</h3>
          <p id="chatSubtitulo" class="text-xs text-slate-400"></p>
        </div>
        <button id="btnFecharChat" class="text-slate-400 hover:text-white text-xl px-2">&times;</button>
      </div>

      <!-- Histórico de Mensagens -->
      <div id="chatMensagens" class="p-4 overflow-y-auto flex-1 space-y-3 bg-[#0c0a1d]/60">
        <p class="text-center text-slate-500 text-xs">Carregando mensagens...</p>
      </div>

      <!-- Formulário de Envio -->
      <form id="chatForm" class="p-4 border-t border-indigo-800/80 space-y-2 bg-indigo-950">
        <div class="flex gap-2">
          <input type="text" id="chatInput" placeholder="Digite sua resposta técnica..." class="flex-1 px-3 py-2 bg-indigo-900/40 border border-indigo-700/60 text-white text-sm rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
          <label class="cursor-pointer px-3 py-2 bg-indigo-900/60 hover:bg-indigo-800 border border-indigo-700/60 rounded-lg text-sm flex items-center justify-center" title="Anexar imagem">
            📎
            <input type="file" id="chatAnexo" accept="image/*" class="hidden">
          </label>
          <button type="submit" id="btnEnviarMsg" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition">Enviar</button>
        </div>
        <div id="chatAnexoNome" class="text-xs text-blue-300 hidden"></div>
      </form>
    </div>
  </div>

  <script>
    // Usa sessionStorage para exigir senha ao fechar a aba/navegador
    let senhaTecnico = sessionStorage.getItem("senhaTecnico") || "";
    let todosChamados = [];
    let modoVisualizacao = "cards";
    let chamadoChatAtual = null;
    let intervaloChat = null;

    const loginScreen = document.getElementById("loginScreen");
    const techPanel = document.getElementById("techPanel");
    const loginForm = document.getElementById("loginForm");
    const senhaInput = document.getElementById("senhaInput");
    const btnSair = document.getElementById("btnSair");
    const filtroTexto = document.getElementById("filtroTexto");
    const ordenacaoSelect = document.getElementById("ordenacao");
    const btnModoCards = document.getElementById("btnModoCards");
    const btnModoPlanilha = document.getElementById("btnModoPlanilha");
    const viewCards = document.getElementById("viewCards");
    const viewPlanilha = document.getElementById("viewPlanilha");

    // Elementos do Chat
    const chatModal = document.getElementById("chatModal");
    const btnFecharChat = document.getElementById("btnFecharChat");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const chatAnexo = document.getElementById("chatAnexo");
    const chatAnexoNome = document.getElementById("chatAnexoNome");
    const chatMensagens = document.getElementById("chatMensagens");

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    if (senhaTecnico) {
      verificarEIniciar(senhaTecnico);
    }

    if (loginForm) {
      loginForm.onsubmit = async (e) => {
        e.preventDefault();
        await verificarEIniciar(senhaInput.value.trim());
      };
    }

    if (btnSair) {
      btnSair.onclick = () => {
        sessionStorage.removeItem("senhaTecnico");
        location.reload();
      };
    }

    if (btnModoCards) {
      btnModoCards.onclick = () => {
        modoVisualizacao = "cards";
        btnModoCards.className = "px-3 py-1.5 text-xs font-medium rounded-md bg-blue-600 text-white transition";
        btnModoPlanilha.className = "px-3 py-1.5 text-xs font-medium rounded-md text-slate-300 hover:text-white transition";
        viewCards.classList.remove("hidden");
        viewPlanilha.classList.add("hidden");
        renderizarPainel();
      };
    }

    if (btnModoPlanilha) {
      btnModoPlanilha.onclick = () => {
        modoVisualizacao = "planilha";
        btnModoPlanilha.className = "px-3 py-1.5 text-xs font-medium rounded-md bg-blue-600 text-white transition";
        btnModoCards.className = "px-3 py-1.5 text-xs font-medium rounded-md text-slate-300 hover:text-white transition";
        viewPlanilha.classList.remove("hidden");
        viewCards.classList.add("hidden");
        renderizarPainel();
      };
    }

    if (filtroTexto) filtroTexto.oninput = renderizarPainel;
    if (ordenacaoSelect) ordenacaoSelect.onchange = renderizarPainel;

    async function verificarEIniciar(senha) {
      try {
        const res = await fetch("/admin/chamados", {
          headers: { "x-tech-password": senha }
        });

        if (!res.ok) {
          alert("Senha incorreta!");
          sessionStorage.removeItem("senhaTecnico");
          return;
        }

        senhaTecnico = senha;
        sessionStorage.setItem("senhaTecnico", senha);
        loginScreen.classList.add("hidden");
        techPanel.classList.remove("hidden");
        
        carregarChamadosTecnico();
        setInterval(carregarChamadosTecnico, 5000);
      } catch (err) {
        console.error("Erro ao autenticar:", err);
        alert("Erro de conexão com o servidor.");
      }
    }

    async function carregarChamadosTecnico() {
      if (!senhaTecnico) return;
      try {
        const res = await fetch("/admin/chamados", {
          headers: { "x-tech-password": senhaTecnico }
        });
        if (res.ok) {
          todosChamados = await res.json();
          renderizarPainel();
        } else if (res.status === 401) {
          sessionStorage.removeItem("senhaTecnico");
          location.reload();
        }
      } catch (err) {
        console.error("Erro ao buscar chamados:", err);
      }
    }

    async function alterarStatus(id, novoStatus) {
      let notasConclusao = null;
      if (novoStatus === "Concluído") {
        notasConclusao = prompt("Digite o diagnóstico / notas obrigatórias da conclusão:");
        if (notasConclusao === null) return;
        if (!notasConclusao.trim()) {
          alert("É obrigatório informar o diagnóstico para concluir o chamado.");
          return;
        }
        notasConclusao = notasConclusao.trim();
      }

      try {
        const res = await fetch(`/admin/chamados/${encodeURIComponent(id)}/status`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "x-tech-password": senhaTecnico
          },
          body: JSON.stringify({ status: novoStatus, notasConclusao })
        });

        if (res.ok) {
          await carregarChamadosTecnico();
        } else {
          const erroTexto = await res.text();
          console.error(`Falha HTTP ${res.status}:`, erroTexto);
          alert(`Erro ao alterar status (HTTP ${res.status}): ${erroTexto || "verifique a rota no servidor."}`);
        }
      } catch (err) {
        console.error("Erro de rede/CORS ao alterar status:", err);
        alert("Erro de conexão ao tentar alterar o status. Verifique o console (F12).");
      }
    }

    // --- FUNÇÕES DO CHAT ---
    function abrirChat(id) {
      const chamado = todosChamados.find(c => String(c.id) === String(id));
      if (!chamado) return;

      chamadoChatAtual = chamado;
      document.getElementById("chatTitulo").textContent = `💬 Chamado #${chamado.id} - ${chamado.titulo}`;
      document.getElementById("chatSubtitulo").textContent = `Setor: ${chamado.solicitante} • Status: ${chamado.status}`;
      chatModal.classList.remove("hidden");

      carregarMensagensChat();
      if (intervaloChat) clearInterval(intervaloChat);
      intervaloChat = setInterval(carregarMensagensChat, 3000);
    }

    function fecharChat() {
      chatModal.classList.add("hidden");
      chamadoChatAtual = null;
      if (intervaloChat) {
        clearInterval(intervaloChat);
        intervaloChat = null;
      }
    }

    if (btnFecharChat) btnFecharChat.onclick = fecharChat;

    if (chatAnexo) {
      chatAnexo.onchange = () => {
        if (chatAnexo.files.length > 0) {
          chatAnexoNome.textContent = `📎 Anexo selecionado: ${chatAnexo.files[0].name}`;
          chatAnexoNome.classList.remove("hidden");
        } else {
          chatAnexoNome.classList.add("hidden");
        }
      };
    }

    async function carregarMensagensChat() {
      if (!chamadoChatAtual) return;
      try {
        const res = await fetch(`/chamados/${encodeURIComponent(chamadoChatAtual.id)}/mensagens`, {
          headers: { "x-tech-password": senhaTecnico }
        });
        if (!res.ok) {
          chatMensagens.innerHTML = `<p class="text-center text-red-400 text-xs">Erro ao carregar mensagens (HTTP ${res.status}).</p>`;
          return;
        }

        const mensagens = await res.json();
        const estavaNoFundo = chatMensagens.scrollHeight - chatMensagens.scrollTop <= chatMensagens.clientHeight + 60;

        let html = `
          <div class="bg-indigo-900/30 border border-indigo-800/60 p-3 rounded-xl text-xs text-slate-300">
            <div class="font-semibold text-slate-200 mb-1">📋 Descrição Inicial (${escapeHtml(chamadoChatAtual.solicitante)}):</div>
            <p>${escapeHtml(chamadoChatAtual.descricao)}</p>
            ${chamadoChatAtual.anexo ? `<a href="${escapeHtml(chamadoChatAtual.anexo)}" target="_blank" class="inline-block mt-2"><img src="${escapeHtml(chamadoChatAtual.anexo)}" alt="Anexo inicial" class="max-h-40 rounded-lg border border-indigo-700"></a>` : ""}
          </div>
        `;

        if (mensagens.length === 0) {
          html += `<p class="text-center text-slate-500 text-xs py-4">Nenhuma mensagem trocada ainda. Envie a primeira resposta abaixo.</p>`;
        } else {
          html += mensagens.map(m => {
            const ehTecnico = m.autor === "tecnico";
            return `
              <div class="flex flex-col ${ehTecnico ? "items-end" : "items-start"}">
                <div class="max-w-[80%] rounded-xl p-3 text-sm ${ehTecnico ? "bg-blue-600/30 border border-blue-500/40 text-slate-100" : "bg-indigo-900/50 border border-indigo-800 text-slate-200"}">
                  <div class="text-[11px] font-semibold mb-1 ${ehTecnico ? "text-blue-300" : "text-amber-300"}">
                    ${ehTecnico ? "🛠️ Técnico (Você)" : `👤 ${escapeHtml(chamadoChatAtual.solicitante)}`}
                    <span class="text-slate-400 font-normal ml-2">${formatarData(m.criadoEm)}</span>
                  </div>
                  ${m.texto ? `<p class="whitespace-pre-wrap">${escapeHtml(m.texto)}</p>` : ""}
                  ${m.anexo ? `<a href="${escapeHtml(m.anexo)}" target="_blank" class="block mt-2"><img src="${escapeHtml(m.anexo)}" alt="Anexo" class="max-h-48 rounded-lg border border-indigo-700"></a>` : ""}
                </div>
              </div>
            `;
          }).join("");
        }

        chatMensagens.innerHTML = html;
        if (estavaNoFundo) {
          chatMensagens.scrollTop = chatMensagens.scrollHeight;
        }
      } catch (err) {
        console.error("Erro ao carregar chat:", err);
      }
    }

    if (chatForm) {
      chatForm.onsubmit = async (e) => {
        e.preventDefault();
        if (!chamadoChatAtual) return;

        const texto = chatInput.value.trim();
        const arquivo = chatAnexo.files[0];
        if (!texto && !arquivo) return;

        const formData = new FormData();
        formData.append("autor", "tecnico");
        formData.append("texto", texto);
        if (arquivo) {
          formData.append("anexo", arquivo);
        }

        const btnEnviar = document.getElementById("btnEnviarMsg");
        btnEnviar.disabled = true;

        try {
          const res = await fetch(`/chamados/${encodeURIComponent(chamadoChatAtual.id)}/mensagens`, {
            method: "POST",
            headers: { "x-tech-password": senhaTecnico },
            body: formData
          });

          if (res.ok) {
            chatInput.value = "";
            chatAnexo.value = "";
            chatAnexoNome.classList.add("hidden");
            await carregarMensagensChat();
            chatMensagens.scrollTop = chatMensagens.scrollHeight;
          } else {
            const erroTexto = await res.text();
            alert(`Erro ao enviar mensagem (HTTP ${res.status}): ${erroTexto}`);
          }
        } catch (err) {
          console.error("Erro ao enviar mensagem:", err);
          alert("Erro de conexão ao enviar mensagem.");
        } finally {
          btnEnviar.disabled = false;
        }
      };
    }

    function formatarData(dataISO) {
      if (!dataISO) return "Data não informada";
      const data = new Date(dataISO);
      if (isNaN(data.getTime())) return dataISO;
      return data.toLocaleString("pt-BR", {
        day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"
      });
    }

    function renderizarPainel() {
      const textoFiltro = filtroTexto ? filtroTexto.value.toLowerCase() : "";
      const ordem = ordenacaoSelect ? ordenacaoSelect.value : "recente";

      let filtrados = todosChamados.filter(c => 
        String(c.id).toLowerCase().includes(textoFiltro) ||
        (c.titulo && c.titulo.toLowerCase().includes(textoFiltro)) ||
        (c.descricao && c.descricao.toLowerCase().includes(textoFiltro)) ||
        (c.solicitante && c.solicitante.toLowerCase().includes(textoFiltro)) ||
        (c.status && c.status.toLowerCase().includes(textoFiltro))
      );

      filtrados.sort((a, b) => {
        if (ordem === "recente") {
          const diff = Number(b.id) - Number(a.id);
          return !isNaN(diff) ? diff : new Date(b.criadoEm || 0) - new Date(a.criadoEm || 0);
        }
        if (ordem === "antigo") {
          const diff = Number(a.id) - Number(b.id);
          return !isNaN(diff) ? diff : new Date(a.criadoEm || 0) - new Date(b.criadoEm || 0);
        }
        if (ordem === "prioridade") {
          const pesos = { "Alta": 3, "Média": 2, "Baixa": 1 };
          return (pesos[b.prioridade] || 0) - (pesos[a.prioridade] || 0);
        }
        if (ordem === "status") {
          const pesosStatus = { "Aberto": 3, "Em Atendimento": 2, "Concluído": 1 };
          return (pesosStatus[b.status] || 0) - (pesosStatus[a.status] || 0);
        }
        return 0;
      });

      const badgePrioridade = {
        "Alta": "bg-red-500/20 text-red-300 border-red-500/30",
        "Média": "bg-amber-500/20 text-amber-300 border-amber-500/30",
        "Baixa": "bg-emerald-500/20 text-emerald-300 border-emerald-500/30",
      };

      const badgeStatus = {
        "Aberto": "bg-amber-500/30 text-amber-300 border-amber-500/40",
        "Em Atendimento": "bg-blue-500/30 text-blue-300 border-blue-500/40",
        "Concluído": "bg-emerald-500/30 text-emerald-300 border-emerald-500/40",
      };

      if (filtrados.length === 0) {
        if (viewCards) viewCards.innerHTML = `<div class="bg-indigo-950/40 border border-indigo-900/50 p-8 text-center text-slate-400 rounded-xl">Nenhum chamado encontrado.</div>`;
        const corpoTabela = document.getElementById("tabelaCorpo");
        if (corpoTabela) corpoTabela.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-400">Nenhum chamado encontrado.</td></tr>`;
        return;
      }

      if (viewCards) {
        viewCards.innerHTML = filtrados.map(c => {
          const idSeguro = escapeHtml(c.id);
          return `
            <div class="bg-indigo-950/60 border border-indigo-900/60 p-5 rounded-xl shadow-md flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div class="space-y-2 w-full">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${badgePrioridade[c.prioridade] || ''}">${escapeHtml(c.prioridade)}</span>
                  <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${badgeStatus[c.status] || ''}">${escapeHtml(c.status)}</span>
                  <span class="text-xs text-slate-400 font-mono">#${idSeguro}</span>
                </div>
                <h3 class="text-base font-bold text-slate-100">${escapeHtml(c.titulo)}</h3>
                <p class="text-sm text-slate-300">${escapeHtml(c.descricao)}</p>
                ${c.anexo ? `<a href="${escapeHtml(c.anexo)}" target="_blank" class="inline-block text-xs text-blue-400 hover:underline">🖼️ Ver imagem anexada pelo usuário</a>` : ''}
                ${c.notasConclusao ? `<p class="text-xs text-emerald-400 bg-emerald-950/40 p-2 rounded border border-emerald-900/50"><strong>Notas de Conclusão:</strong> ${escapeHtml(c.notasConclusao)}</p>` : ''}
                <div class="flex items-center gap-6 text-xs text-slate-400 pt-2 border-t border-indigo-900/40">
                  <span>📍 Setor: <strong class="text-slate-200">${escapeHtml(c.solicitante)}</strong></span>
                  <span>📅 Solicitado em: <strong class="text-slate-200">${formatarData(c.criadoEm)}</strong></span>
                </div>
              </div>
              <div class="flex items-center gap-2 w-full md:w-auto justify-end shrink-0">
                <button onclick="abrirChat('${idSeguro}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-medium shadow">💬 Chat</button>
                <button onclick="alterarStatus('${idSeguro}', 'Em Atendimento')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium shadow">⏳ Atender</button>
                <button onclick="alterarStatus('${idSeguro}', 'Concluído')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-medium shadow">✅ Concluir</button>
              </div>
            </div>
          `;
        }).join("");
      }

      const corpoTabela = document.getElementById("tabelaCorpo");
      if (corpoTabela) {
        corpoTabela.innerHTML = filtrados.map(c => {
          const idSeguro = escapeHtml(c.id);
          return `
            <tr class="hover:bg-indigo-900/30 transition">
              <td class="p-4 font-mono font-bold text-slate-400">#${idSeguro}</td>
              <td class="p-4 text-xs text-slate-300">${formatarData(c.criadoEm)}</td>
              <td class="p-4 font-medium text-white">${escapeHtml(c.solicitante)}</td>
              <td class="p-4 font-semibold text-slate-100">${escapeHtml(c.titulo)}</td>
              <td class="p-4 text-slate-300 max-w-xs truncate">${escapeHtml(c.descricao)}</td>
              <td class="p-4">
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${badgePrioridade[c.prioridade] || ''}">${escapeHtml(c.prioridade)}</span>
              </td>
              <td class="p-4">
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full border ${badgeStatus[c.status] || ''}">${escapeHtml(c.status)}</span>
              </td>
              <td class="p-4 text-center">
                <div class="flex items-center justify-center gap-2">
                  <button onclick="abrirChat('${idSeguro}')" title="Abrir Chat" class="p-1.5 bg-indigo-600/80 hover:bg-indigo-600 text-white rounded text-xs">💬</button>
                  <button onclick="alterarStatus('${idSeguro}', 'Em Atendimento')" title="Marcar Em Atendimento" class="p-1.5 bg-blue-600/80 hover:bg-blue-600 text-white rounded text-xs">⏳</button>
                  <button onclick="alterarStatus('${idSeguro}', 'Concluído')" title="Concluir Chamado" class="p-1.5 bg-emerald-600/80 hover:bg-emerald-600 text-white rounded text-xs">✅</button>
                </div>
              </td>
            </tr>
          `;
        }).join("");
      }
    }
  </script>
</body>
</html>
