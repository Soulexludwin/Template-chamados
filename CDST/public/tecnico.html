<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Painel do Técnico - TI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">

  <!-- Autenticação -->
  <div id="modalLogin" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-slate-800 p-6 rounded-xl w-full max-w-sm space-y-4">
      <h2 class="text-xl font-bold">🔐 Acesso Restrito - TI</h2>
      <input type="password" id="inputSenha" placeholder="Digite a senha do técnico" class="w-full px-3 py-2 bg-slate-700 text-white rounded border border-slate-600 focus:outline-none">
      <button id="btnEntrar" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold">Entrar</button>
    </div>
    <div id="voltar" class="px-6 py-4"></div>
      <a href="/index.html" class="bg-purple-900/80 hover:bg-purple-800 text-purple-200 border border-purple-700/50 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <span>🔄️</span> Voltar
      </a>
    </div>
  </div>

  <!-- Gerenciamento -->
  <main id="painelTecnico" class="hidden max-w-6xl mx-auto space-y-6">
    <div class="flex justify-between items-center border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold">🛠️ Painel Geral de Chamados</h1>
      <button onclick="sessionStorage.clear(); location.reload();" class="text-xs bg-red-600 hover:bg-red-700 px-3 py-2 rounded">Sair</button>
    </div>

    <div id="gridChamados" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <script>
    let senhaSalva = sessionStorage.getItem("senha_ti") || "";

    async function carregarTodosChamados() {
      const res = await fetch("/admin/chamados", {
        headers: { "x-tech-password": senhaSalva }
      });

      if (res.status === 401) {
        alert("Senha incorreta!");
        sessionStorage.removeItem("senha_ti");
        location.reload();
        return;
      }

      document.getElementById("modalLogin").classList.add("hidden");
      document.getElementById("painelTecnico").classList.remove("hidden");

      const chamados = await res.json();
      const grid = document.getElementById("gridChamados");

      grid.innerHTML = chamados.reverse().map(c => `
        <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 space-y-3">
          <div class="flex justify-between">
            <span class="font-bold text-blue-400">#${c.id} - ${c.titulo}</span>
            <span class="text-xs px-2 py-1 rounded bg-slate-700 font-bold">${c.status}</span>
          </div>
          <p class="text-sm text-slate-300">${c.descricao}</p>
          <div class="text-xs text-slate-400">Solicitante: <strong>${c.solicitante}</strong></div>
          <div class="flex gap-2 pt-2">
            <button onclick="mudarStatus(${c.id}, 'Em Atendimento')" class="text-xs bg-blue-600 px-3 py-1 rounded">Atender</button>
            <button onclick="mudarStatus(${c.id}, 'Concluído')" class="text-xs bg-emerald-600 px-3 py-1 rounded">Concluir</button>
          </div>
        </div>
      `).join("");
    }

    async function mudarStatus(id, status) {
      await fetch(`/admin/chamados/${id}/status`, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          "x-tech-password": senhaSalva
        },
        body: JSON.stringify({ status })
      });
      carregarTodosChamados();
    }

    document.getElementById("btnEntrar").addEventListener("click", () => {
      senhaSalva = document.getElementById("inputSenha").value;
      sessionStorage.setItem("senha_ti", senhaSalva);
      carregarTodosChamados();
    });

    if (senhaSalva) carregarTodosChamados();
  </script>
</body>
</html>
